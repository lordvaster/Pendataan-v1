# ============================================
# Nginx Configuration for PAJAK Application
# Sistem Pendataan Wajib Pajak Kendaraan
# ============================================
#
# INSTALLATION INSTRUCTIONS:
# 1. Copy this file to /etc/nginx/sites-available/
#    sudo cp nginx_config_pajak.conf /etc/nginx/sites-available/pajak.conf
#
# 2. Enable the site
#    sudo ln -s /etc/nginx/sites-available/pajak.conf /etc/nginx/sites-enabled/
#
# 3. Test configuration
#    sudo nginx -t
#
# 4. Reload Nginx
#    sudo systemctl reload nginx
#
# 5. Setup SSL with Certbot
#    sudo certbot --nginx -d pajak.yourdomain.com
#
# ============================================

# OPTION 1: SUBDOMAIN (RECOMMENDED)
# Domain: pajak.yourdomain.com
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name pajak.yourdomain.com;

    # Redirect HTTP to HTTPS (will be added by certbot)
    # return 301 https://$server_name$request_uri;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/pajak_access.log;
    error_log /var/log/nginx/pajak_error.log;

    # Proxy to Apache
    location / {
        proxy_pass https://127.0.0.1:443;
        proxy_http_version 1.1;
        
        # Preserve original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # SSL verification (since Apache uses self-signed cert)
        proxy_ssl_verify off;
    }

    # Static files optimization
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass https://127.0.0.1:443;
        proxy_set_header Host $host;
        
        # Cache static files
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # SSL verification
        proxy_ssl_verify off;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.git {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    # PHP file upload size
    client_max_body_size 10M;
}

