# ============================================
# TESTING
# ============================================
#
# After configuration:
#
# 1. Test Nginx config:
#    sudo nginx -t
#
# 2. Reload Nginx:
#    sudo systemctl reload nginx
#
# 3. Test HTTP access:
#    curl -I http://pajak.yourdomain.com/loginpage.php
#    # Should return HTTP 200
#
# 4. Test HTTPS access (after SSL setup):
#    curl -I https://pajak.yourdomain.com/loginpage.php
#    # Should return HTTP 200
#
# 5. Test in browser:
#    https://pajak.yourdomain.com/loginpage.php
#    # Should show login page
#
